server:
  port: 4040

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fatecrepository}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    use-new-id-generator-mappings: true

  mvc:
    log-request-details: true
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

  task:
    execution:
      thread-name-prefix: fatec-

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
    disable-swagger-default-url: false

logging:
  level:
    root: INFO
    com.fatecrepository: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-this-key-with-at-least-32-chars}
      issuer: ${JWT_ISSUER:fatec-repository-api}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
