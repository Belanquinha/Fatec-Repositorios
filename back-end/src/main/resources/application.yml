server:
  port: 4040

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fatecrepository}
    username: ${POSTGRES_USER:postgres}
    # Sem default de propósito: uma senha vazia ou esquecida faria o banco recusar a
    # conexão em silêncio, e o sintoma apareceria como "a API está no ar mas todo
    # endpoint dá 500". Placeholder não resolvido faz o contexto abortar na subida.
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    use-new-id-generator-mappings: true

  mvc:
    # Fica desligado de propósito. Com spring.security em DEBUG, esta flag escreve o header
    # Authorization por request no log — e o header Authorization carrega o access token da
    # Microsoft e o JWT da sessão. Um access token do Microsoft em disco vale um login válido
    # para quem o ler. O MicrosoftTokenVerifier já loga só metadados do token (aud/iss/tid/kid);
    # esta flag desfazia esse cuidado em toda requisição.
    log-request-details: false
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

  task:
    execution:
      thread-name-prefix: fatec-

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
    disable-swagger-default-url: false

logging:
  level:
    root: INFO
    com.fatecrepository: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  upload:
    # Diretório físico das capas servidas em /uploads/** (WebMvcConfig +
    # FileStorageService + ProjetoSeedLoader usam a mesma chave). O default
    # relativo resolve para ./uploads a partir do WORKDIR; no compose o
    # APP_UPLOAD_DIR aponta para o volume uploads_data (/app/uploads).
    dir: ${APP_UPLOAD_DIR:uploads}
  cors:
    # Origens liberadas no CORS, separadas por vírgula.
    #
    # Em produção isto quase não é exercitado: o nginx serve o front e faz proxy
    # de /api para o back-end, então as duas ficam na mesma origem e o navegador
    # nem envia preflight. O CORS importa mesmo é no `ng serve`, que roda em
    # :4200 e fala com a API em :4040.
    #
    # Estava hardcoded no SecurityConfig, o que obrigava a recompilar o Java para
    # trocar a porta do front. `http://frontend` é remanescente de quando se
    # supunha chamar o service name pelo navegador: o navegador nunca faz isso,
    # porque quem chama a API é a página servida por esse mesmo serviço.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:4200,http://127.0.0.1:4200,http://frontend}
  security:
    jwt:
      # Sem default, e isso é o ponto: o valor padrão anterior
      # ('dev-secret-change-this-key-with-at-least-32-chars') estava versionado
      # no repositório. Um deploy que esquecesse de setar JWT_SECRET passaria a
      # assinar token com uma chave pública, e qualquer pessoa poderia forjar
      # sessão de admin. Placeholder não resolvido aborta a subida do contexto.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:fatec-repository-api}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    msal:
      # Tenant da CPS (AD-3). O token precisa ter este 'tid' e ser assinado por chave do
      # Microsoft correspondente ao tenant. Recusado com 401 caso contrário.
      tenant-id: ${MSAL_TENANT_ID:eabe64c5-68f5-4a76-8301-9577a679e449}
      # Chaves públicas do Microsoft, usadas para verificar a assinatura do access token.
      # Endpoint de discovery de chaves. Apontar para o tenant da CPS (e não 'common') faz o
      # conjunto conter só as chaves daquele diretório. O caminho precisa ser
      # '/discovery/v2.0/keys' — o '/v2.0/keys' sem '/discovery' devolve 404.
      jwks-uri: ${MSAL_JWKS_URI:https://login.microsoftonline.com/eabe64c5-68f5-4a76-8301-9577a679e449/discovery/v2.0/keys}
  # Não existe login sem Microsoft. Houve um /auth/dev-login que emitia sessão válida para
  # qualquer e-mail digitado, inclusive a conta de admin, e ele foi removido de propósito:
  # /auth/** é permitAll, então a proteção dependia inteiramente de configuração de ambiente —
  # isto é, de nenhum código. Testar os três papéis continua coberto pelos testes E2E, que
  # emitem tokens reais via JwtTokenProvider (ApiE2ETestSupport#tokenPara), sem rota aberta.

faterepo:
  seed:
    mode: ${FATEREPO_SEED_MODE:upsert}   # upsert (padrão) | replace
    files:                                # ordem declarada = ordem de carga (FK-safe)
      - seeds/instituicoes.csv
      - seeds/projetos.json
