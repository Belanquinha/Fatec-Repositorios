<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Vitrine institucional de tecnologia
  </title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- link do google fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,0" />

  <!-- favicon do site -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Aplica o tema e tamanho de fonte salvos antes do Angular carregar (evita flash).
       Espelha a lógica de ThemeService e Configurações de acessibilidade. -->
  <script>
    try {
      var temaSalvo = localStorage.getItem('fatec-tema');
      if (temaSalvo === 'escuro' || (!temaSalvo && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      var fonteSalva = localStorage.getItem('fatec-tamanho-fonte');
      if (fonteSalva) {
        document.documentElement.style.fontSize = fonteSalva;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
