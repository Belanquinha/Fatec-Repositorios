<div class="frame-conteudo">
  <h1>Central de Admin</h1>
  <div class="frame-links">
    <a (click)="toggleCadastroInstituicao()" [class.link-ativo]="cadastroInstituicaoAberto" class="link">Cadastrar Instituição</a>
    <hr>
    <a routerLink="/" class="link">Ver Instituições Cadastradas</a>
    <hr> 
    <a routerLink="/" class="link">Editar Instituição</a>
  </div>

  @if (cadastroInstituicaoAberto) {
  <div class="frame-cadastro">
    <app-cadastro-instituicao></app-cadastro-instituicao>
  </div>
  }
</div>
