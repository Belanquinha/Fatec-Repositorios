<div class="frame-conteudo">
    <h1>Cadastro de Instituições</h1>

    <form action="" method="post">
        <div class="frame-inputs">
            <div class="frame-row">
                <div class="frame-input-unico">
                    <label for="nome-instituicao">Nome da Instituição</label>
                    <input type="text" id="nome-instituicao" name="nome_instituicao" placeholder="Ex: Fatec Ipiranga" required>
                </div>
                <div class="frame-input-unico">
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0001-00" required>
                </div>
            </div>

            <div class="frame-row">
                <div class="frame-input-unico">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Ex: São Paulo" required>
                </div>
                <div class="frame-input-unico">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" placeholder="Ex: São Paulo" required>
                </div>
            </div>

            <div class="frame-row">
                <div class="frame-input-unico">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Ex: R. Frei João, 59 - Vila Nair" required>
                </div>
            </div>

            <hr>

            <div class="frame-row">
                <div class="frame-input-unico">
                    <label for="nome-gestor">Nome Completo do Gestor</label>
                    <input type="text" id="nome-gestor" name="nome_gestor" placeholder="Ex: José da Silva" required>
                </div>
                <div class="frame-input-unico">
                    <label for="email-gestor">Email do Gestor</label>
                    <input type="email" id="email-gestor" name="email_gestor" placeholder="Ex: email@dominio.com" required>
                </div>
            </div>

            <div class="frame-row">
                <div class="frame-input-unico">
                    <label for="telefone-gestor">Telefone do Gestor</label>
                    <input type="tel" id="telefone-gestor" name="telefone_gestor" placeholder="Ex: (00) 00000-0000" required>
                </div>
                <div class="frame-input-unico">
                    <label for="senha-gestor">Senha da Conta do Gestor</label>
                    <input type="password" id="senha-gestor" name="senha_gestor" placeholder="••••••••" required>
                </div>
            </div>
        </div>

        <hr>

        <div class="frame-links">
            <button type="submit" class="bnt-submit">Cadastrar Instituição</button>
        </div>
    </form>
</div>
