@if (usuarioLogado && usuario) {
  <div class="perfil-container">
    @if (usuario.foto) {
      <img [src]="usuario.foto" alt="Foto de perfil" class="foto-perfil" />
    }
    <p>Olá, <strong>{{ usuario.nome }}</strong>!</p>
    <p class="email">{{ usuario.email }}</p>
    <button (click)="logout()">Sair</button>
  </div>
} @else {
  <div class="frame-button">
    <span class="material-symbols-outlined icon">school</span>
    <button
      (click)="login()"
      class="button"
      [disabled]="inicializando || entrandoComoDev"
    >
      Login com Microsoft
    </button>
  </div>

  <!--
    Atalhos de desenvolvimento. `@if` sobre o comprimento da lista é a trava: em produção
    `contasDev` chega vazio, porque `environment.devAuthEnabled` é `false` e o back-end nem expõe a
    rota. Nada aqui depende de o botão do Microsoft estar presente.
  -->
  @if (contasDev.length > 0) {
    <div class="dev-login">
      <p class="dev-login-titulo">Entrar sem Microsoft</p>
      @for (conta of contasDev; track conta.email) {
        <button
          class="dev-login-botao"
          (click)="entrarComo(conta)"
          [disabled]="entrandoComoDev"
        >
          {{ conta.rotulo }}
        </button>
      }
      @if (erroDev) {
        <p class="dev-login-erro">{{ erroDev }}</p>
      }
    </div>
  }
}
