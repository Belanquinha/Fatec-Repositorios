@if (usuarioLogado() && usuario()) {
  @let u = usuario()!;
  <div class="perfil-container">
    @if (u.foto) {
      <img [src]="u.foto" alt="Foto de perfil" class="foto-perfil" />
    }
    <p>Olá, <strong>{{ u.nome }}</strong>!</p>
    <p class="email">{{ u.email }}</p>
    <button (click)="logout()">Sair</button>
  </div>
} @else {
  <div class="frame-button">
    <span class="material-symbols-outlined icon">school</span>
    <button
      (click)="login()"
      class="button"
      [disabled]="inicializando()"
    >
      Login com Microsoft
    </button>
  </div>
}
