@if (usuarioLogado() && usuario()) {
  @let u = usuario()!;
  <div class="flex items-center gap-3 px-3 py-2.5">
    @if (u.foto) {
      <img [src]="u.foto" alt="Foto de perfil" class="h-10 w-10 shrink-0 rounded-full border border-branco-600 object-cover dark:border-cinza-400" />
    } @else {
      <span class="material-symbols-outlined shrink-0 text-[32px] leading-none text-cinza-300 dark:text-branco-700">account_circle</span>
    }
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-cinza-500 dark:text-branco-500">Olá, {{ u.nome }}!</p>
      <p class="truncate text-xs text-cinza-300 dark:text-branco-700">{{ u.email }}</p>
      <button
        type="button"
        (click)="logout()"
        class="mt-1 text-xs font-medium text-cinza-400 underline-offset-2 transition-colors hover:text-cinza-600 hover:underline dark:text-branco-600 dark:hover:text-branco-500">
        Sair
      </button>
    </div>
  </div>
} @else {
  <button
    type="button"
    (click)="login()"
    [disabled]="inicializando()"
    class="btn-microsoft-sso flex w-full items-center justify-center gap-2.5 border border-branco-600 bg-branco-50 px-4 py-3 text-sm font-semibold text-cinza-500 transition-colors hover:bg-branco-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amarelo-500 disabled:cursor-not-allowed disabled:opacity-50 dark:border-cinza-400 dark:bg-cinza-700 dark:text-branco-50 dark:hover:bg-cinza-600">
    <span class="material-symbols-outlined text-[20px] leading-none text-amarelo-600 dark:text-amarelo-400">school</span>
    <span>Continuar com Microsoft (CPS)</span>
  </button>
}
