<article class="card">
    <div class="frame-capa">
        <img [src]="capaUrl" [alt]="titulo" class="imagem-capa" (error)="onImgError($event)">
        <span class="badge-status">
            <span class="material-symbols-outlined icon-status">check_circle</span>
            Aprovado
        </span>
    </div>

    <div class="frame-descricao-projeto">
        <div class="tags-container">
            @for (tag of tags; track tag) {
                <span class="tag-chip">{{ tag }}</span>
            }
        </div>

        <h3 class="nome-projeto" [title]="titulo">{{ titulo }}</h3>

        <div class="frame-descricao">
            <p class="descricao">{{ descricao }}</p>
        </div>

        <hr>

        <div class="frame-footer-card">
            <div class="frame-nome-instituicao">
                <span class="material-symbols-outlined icon-instituicao">school</span>
                <span class="nome-instituicao">{{ instituicao }}</span>
            </div>
            <span class="ano-projeto">{{ ano }}</span>
        </div>
    </div>
</article>
