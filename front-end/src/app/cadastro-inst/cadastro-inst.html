<main class="content">
  <h1 class="page-title">Cadastro de Instituições</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="nomeInstituicao">Nome Da Instituição</label>
      <input id="nomeInstituicao" type="text" formControlName="nomeInstituicao" placeholder="Ex: Fatec Ipiranga" />
    </div>

    
    <div class="form-row">
      <div class="form-group">
        <label for="cidade">Cidade</label>
        <input id="cidade" type="text" formControlName="cidade" placeholder="Ex: São Paulo" />
      </div>
      <div class="form-group">
        <label for="estado">Estado</label>
        <input id="estado" type="text" formControlName="estado" placeholder="Ex: São Paulo" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="endereco">Endereço</label>
        <input id="endereco" type="text" formControlName="endereco" placeholder="Ex: R. Frei João, 59 - Vila Nair" />
      </div>
      <div class="form-group">
        <label for="cnpj">CNPJ</label>
        <input id="cnpj" type="text" formControlName="cnpj" placeholder="00.000.000/0001-00" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="nomeGestor">Nome completo do Gestor</label>
        <input id="nomeGestor" type="text" formControlName="nomeGestor" placeholder="Ex: José da Silva" />
      </div>
      <div class="form-group">
        <label for="emailGestor">E-mail do Gestor</label>
        <input id="emailGestor" type="email" formControlName="emailGestor" placeholder="Ex: gestor@email.com" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="telefoneGestor">Telefone do Gestor</label>
        <input id="telefoneGestor" type="tel" formControlName="telefoneGestor" placeholder="Ex: (11) 99999-9999" />
      </div>
      <div class="form-group">
        <label for="senhaGestor">Senha da Conta do Gestor</label>
        <input id="senhaGestor" type="password" formControlName="senhaGestor" placeholder="••••••••" />
      </div>
    </div>

    <hr class="divider" />

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Cadastrar Instituição</button>
      <button type="button" class="btn btn-secondary" (click)="irParaHome()">Ver Instituições Cadastradas</button>
    </div>
  </form>
</main>
