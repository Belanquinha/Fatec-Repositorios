server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos do Angular + fallback de rotas (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy da API: /api/* -> backend Spring Boot
    # O "/api" é removido antes de chegar no backend (ex.: /api/instituicoes -> /instituicoes)
    location /api/ {
        proxy_pass http://backend:4040/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de Uploads: /uploads/* -> backend Spring Boot
    location ^~ /uploads/ {
        proxy_pass http://backend:4040/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O index.html NUNCA pode ser cacheado. É ele que aponta para o bundle com hash, e os assets
    # têm max-age de 7 dias: um index.html em cache amarra o usuário a um bundle antigo por uma
    # semana, sem que nenhum sinal de "versão nova" chegue até ele. Foi exatamente o que aconteceu
    # em desenvolvimento — o navegador servia o bundle velho do cache e o código novo não aparecia.
    # Os arquivos com hash, ao contrário, DEVEM ser cacheados: o hash muda quando o conteúdo muda.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

    # Cache de estáticos (assets com hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}