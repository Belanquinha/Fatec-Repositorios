name: fatecrepository

services:
  postgres:
    image: postgres:17-alpine
    container_name: fatec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatecrepository
      POSTGRES_USER: postgres
      # `${VAR:?msg}` aborta o compose com a mensagem se a variável não existir.
      # O formato anterior (`${VAR:-123456}`) era o pior dos dois mundos: o
      # stack subia com uma senha previsível e o erro só apareceria como
      # "connection refused" muito depois.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD - copie .env.example para .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fatecrepository"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fatec

  backend:
    build: ./back-end
    container_name: fatec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fatecrepository
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD - copie .env.example para .env}
      # Obrigatório e sem default: o valor padrão anterior estava versionado no
      # repositório, então um deploy que esquecesse esta variável passaria a
      # assinar token JWT com chave pública — qualquer um poderia forjar sessão
      # de admin. Ver application.yml.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com ao menos 32 caracteres - copie .env.example para .env}
      JWT_ISSUER: ${JWT_ISSUER:-fatec-repository-api}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      MSAL_TENANT_ID: ${MSAL_TENANT_ID:-eabe64c5-68f5-4a76-8301-9577a679e449}
      # Diretório físico das capas (FileStorageService + seed). Precisa apontar
      # para dentro do volume uploads_data montado abaixo.
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "4040:4040"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fatec

  frontend:
    # Sem `build.args`: o front-end não recebe configuração por build.
    # A API é a constante relativa `/api` e o nginx abaixo decide o destino.
    build:
      context: ./front-end
    container_name: fatec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - fatec

volumes:
  postgres_data:
  uploads_data:

networks:
  fatec:
    driver: bridge